<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="New episodes are added to playlists automatically or wait in the inbox; starting a playlist puts its episodes into the queue, from where you left off.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #F2F2F7; }
    .card { fill: #FFFFFF; }
    .primary { fill: #000000; }
    .secondary { fill: #6C6C70; }
    .sep { fill: #E5E5EA; }
    .line { stroke: #8E8E93; }
    .arrowhead { fill: #8E8E93; }
    .white { fill: #FFFFFF; }
    .indigo { fill: #5856D6; }
    .red { fill: #FF3B30; } .green { fill: #34C759; } .teal { fill: #30B0C7; }
    .blue { fill: #007AFF; } .gray { fill: #8E8E93; }
    .stroke-green { stroke: #34C759; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #000000; }
      .card { fill: #1C1C1E; }
      .primary { fill: #FFFFFF; }
      .secondary { fill: #AEAEB2; }
      .sep { fill: #38383A; }
      .line { stroke: #8E8E93; }
      .indigo { fill: #5E5CE6; }
      .red { fill: #FF453A; } .green { fill: #30D158; } .teal { fill: #40C8E0; }
      .blue { fill: #0A84FF; }
      .stroke-green { stroke: #30D158; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <!-- SF Symbol stand-ins, drawn in a 52 × 52 box -->
    <g id="newspaper" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="12" y="14" width="28" height="24" rx="3"/>
      <path d="M18 21 H34 M18 27 H34 M18 33 H28"/>
    </g>
    <g id="sportscourt" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="15" width="32" height="22" rx="3"/>
      <path d="M26 15 V37"/>
      <circle cx="26" cy="26" r="5"/>
    </g>
    <g id="graduationcap" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 13 L44 21 L26 29 L8 21 Z" fill="#FFFFFF"/>
      <path d="M16 25 V32 C16 36 36 36 36 32 V25" fill="none"/>
      <path d="M44 21 V32" fill="none"/>
    </g>
  </defs>

  <rect class="bg" width="1280" height="640" rx="36"/>

  <!-- Column headers -->
  <g font-size="24" font-weight="700">
    <circle class="red" cx="56" cy="62" r="16"/>
    <text class="white" x="56" y="69" font-size="18" text-anchor="middle">1</text>
    <text class="primary" x="82" y="70">New episodes</text>

    <circle class="indigo" cx="476" cy="62" r="16"/>
    <text class="white" x="476" y="69" font-size="18" text-anchor="middle">2</text>
    <text class="primary" x="502" y="70">Playlists</text>

    <circle class="teal" cx="896" cy="62" r="16"/>
    <text class="white" x="896" y="69" font-size="18" text-anchor="middle">3</text>
    <text class="primary" x="922" y="70">Queue</text>
  </g>

  <!-- 1 · New episodes -->
  <rect class="card" x="40" y="100" width="350" height="250" rx="22"/>
  <g>
    <rect class="red" x="60" y="121" width="48" height="48" rx="10" fill-opacity="0.25"/>
    <text class="primary" x="124" y="141" font-size="19" font-weight="600">Morning Briefing</text>
    <text class="secondary" x="124" y="165" font-size="16">Today · 18 min</text>
    <rect class="red" x="306" y="131" width="66" height="28" rx="14" fill-opacity="0.15"/>
    <text class="red" x="339" y="150" font-size="14" font-weight="500" text-anchor="middle">News</text>

    <rect class="sep" x="124" y="184" width="266" height="1"/>

    <rect class="green" x="60" y="201" width="48" height="48" rx="10" fill-opacity="0.25"/>
    <text class="primary" x="124" y="221" font-size="19" font-weight="600">Extra Time #89</text>
    <text class="secondary" x="124" y="245" font-size="16">Today · 54 min</text>
    <rect class="green" x="300" y="211" width="72" height="28" rx="14" fill-opacity="0.15"/>
    <text class="green" x="336" y="230" font-size="14" font-weight="500" text-anchor="middle">Sports</text>

    <rect class="sep" x="124" y="264" width="266" height="1"/>

    <rect class="gray" x="60" y="281" width="48" height="48" rx="10" fill-opacity="0.25"/>
    <text class="primary" x="124" y="301" font-size="19" font-weight="600">Side Quest</text>
    <text class="secondary" x="124" y="325" font-size="16">Yesterday · 1 h 12 min</text>
    <rect class="gray" x="306" y="291" width="66" height="28" rx="14" fill-opacity="0.15"/>
    <text class="secondary" x="339" y="310" font-size="14" font-weight="500" text-anchor="middle">Inbox</text>
  </g>

  <!-- Inbox -->
  <rect class="card" x="40" y="374" width="350" height="226" rx="22"/>
  <text class="primary" x="64" y="416" font-size="22" font-weight="700">Inbox</text>
  <circle class="red" cx="148" cy="409" r="13"/>
  <text class="white" x="148" y="415" font-size="15" font-weight="600" text-anchor="middle">1</text>
  <g class="secondary" font-size="17">
    <text x="64" y="452">Every new episode lands here.</text>
    <text x="64" y="478">Auto-added ones are already done;</text>
    <text x="64" y="504">sort the rest with a swipe.</text>
  </g>
  <g font-size="15" font-weight="500" text-anchor="middle">
    <rect class="blue" x="64" y="534" width="80" height="34" rx="17" fill-opacity="0.15"/>
    <text class="blue" x="104" y="556">Add</text>
    <rect class="blue" x="154" y="534" width="104" height="34" rx="17" fill-opacity="0.15"/>
    <text class="blue" x="206" y="556">Play next</text>
    <rect class="gray" x="268" y="534" width="98" height="34" rx="17" fill-opacity="0.15"/>
    <text class="secondary" x="317" y="556">Discard</text>
  </g>

  <!-- Arrows 1 → 2 -->
  <text class="secondary" x="425" y="122" font-size="13" text-anchor="middle">auto-add</text>
  <path class="line" d="M396 145 C425 145 425 176 452 176" fill="none" stroke-width="2" marker-end="url(#arrow)"/>
  <path class="line" d="M396 225 C425 225 425 350 452 350" fill="none" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 · Playlists -->
  <rect class="card" x="460" y="100" width="350" height="152" rx="22"/>
  <rect class="red" x="480" y="120" width="52" height="52" rx="12"/>
  <use href="#newspaper" x="480" y="120"/>
  <text class="primary" x="548" y="154" font-size="22" font-weight="700">News</text>
  <text class="secondary" x="480" y="204" font-size="16">4 podcasts · new episodes on top</text>
  <text class="primary" x="480" y="230" font-size="16"><tspan class="secondary">Next:</tspan> Morning Briefing</text>

  <rect class="card" x="460" y="274" width="350" height="152" rx="22"/>
  <rect class="green" x="480" y="294" width="52" height="52" rx="12"/>
  <use href="#sportscourt" x="480" y="294"/>
  <text class="primary" x="548" y="328" font-size="22" font-weight="700">Sports</text>
  <text class="secondary" x="480" y="378" font-size="16">3 podcasts · new episodes at the end</text>
  <text class="primary" x="480" y="404" font-size="16"><tspan class="secondary">Playing:</tspan> Extra Time #88</text>

  <rect class="card" x="460" y="448" width="350" height="152" rx="22"/>
  <rect class="teal" x="480" y="468" width="52" height="52" rx="12"/>
  <use href="#graduationcap" x="480" y="468"/>
  <text class="primary" x="548" y="502" font-size="22" font-weight="700">Knowledge</text>
  <text class="secondary" x="480" y="552" font-size="16">7 podcasts · keeps played episodes</text>
  <text class="primary" x="480" y="578" font-size="16"><tspan class="secondary">Continue:</tspan> Deep Field · 41:05</text>

  <!-- Arrow 2 → 3 -->
  <text class="secondary" x="845" y="326" font-size="13" text-anchor="middle">▶ start</text>
  <path class="line" d="M816 350 C845 350 845 392 872 392" fill="none" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 · Queue: one flat list of episodes -->
  <rect class="card" x="880" y="100" width="360" height="500" rx="22"/>
  <text class="secondary" x="900" y="136" font-size="15" font-weight="600">NOW PLAYING</text>
  <rect class="green" x="900" y="150" width="56" height="56" rx="12" fill-opacity="0.25"/>
  <text class="primary" x="972" y="174" font-size="19" font-weight="600">Extra Time #88</text>
  <text class="secondary" x="972" y="198" font-size="16">Sports · 23:10 of 54:00</text>
  <rect class="sep" x="900" y="222" width="320" height="6" rx="3"/>
  <rect class="blue" x="900" y="222" width="137" height="6" rx="3"/>

  <text class="secondary" x="900" y="268" font-size="15" font-weight="600">QUEUE</text>

  <text class="primary" x="900" y="304" font-size="19" font-weight="600">Side Quest</text>
  <text class="secondary" x="900" y="328" font-size="16">Single episode · 1 h 12 min</text>

  <rect class="sep" x="900" y="346" width="340" height="1"/>

  <text class="primary" x="900" y="372" font-size="19" font-weight="600">Extra Time #89</text>
  <text class="secondary" x="900" y="396" font-size="16">54 min</text>
  <rect class="green" x="1148" y="356" width="72" height="28" rx="14" fill-opacity="0.15"/>
  <text class="green" x="1184" y="375" font-size="14" font-weight="500" text-anchor="middle">Sports</text>

  <rect class="sep" x="900" y="414" width="340" height="1"/>

  <text class="primary" x="900" y="440" font-size="19" font-weight="600">Matchday Live</text>
  <text class="secondary" x="900" y="464" font-size="16">1 h 05 min</text>
  <rect class="green" x="1148" y="424" width="72" height="28" rx="14" fill-opacity="0.15"/>
  <text class="green" x="1184" y="443" font-size="14" font-weight="500" text-anchor="middle">Sports</text>

  <rect class="sep" x="900" y="482" width="340" height="1"/>

  <text class="primary" x="900" y="508" font-size="19" font-weight="600">Morning Briefing</text>
  <text class="secondary" x="900" y="532" font-size="16">18 min</text>
  <rect class="red" x="1154" y="492" width="66" height="28" rx="14" fill-opacity="0.15"/>
  <text class="red" x="1187" y="511" font-size="14" font-weight="500" text-anchor="middle">News</text>

  <rect class="sep" x="900" y="550" width="340" height="1"/>
  <text class="blue" x="900" y="582" font-size="16" font-weight="500">↶ Previous queues</text>
</svg>
