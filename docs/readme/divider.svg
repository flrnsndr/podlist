<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 12" width="240" height="12" role="presentation">
  <style>
    .red { fill: #FF3B30; } .indigo { fill: #5856D6; } .teal { fill: #30B0C7; } .orange { fill: #FF9500; }
    @media (prefers-color-scheme: dark) {
      .red { fill: #FF453A; } .indigo { fill: #5E5CE6; } .teal { fill: #40C8E0; } .orange { fill: #FF9F0A; }
    }
  </style>
  <!-- The logo's ring, unrolled: same four colors, same rounded ends, same gaps -->
  <rect class="red" x="0" y="0" width="54" height="12" rx="6"/>
  <rect class="indigo" x="62" y="0" width="54" height="12" rx="6"/>
  <rect class="teal" x="124" y="0" width="54" height="12" rx="6"/>
  <rect class="orange" x="186" y="0" width="54" height="12" rx="6"/>
</svg>
